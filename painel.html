<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuração 2º Turno</title>
<script>try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://resultados.tse.jus.br" crossorigin>
<link rel="preload" href="brasil.json" as="fetch" crossorigin>
<!-- fonte carrega sem bloquear a primeira pintura; até chegar, usa a fonte do sistema -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f4f5f7;--card:#fff;--card2:#f8f9fb;--tx:#14161a;--mut:#6b7280;--ln:#e6e8ec;--na:#d9dce2;--txi:#14161a;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);--tsh:0 10px 30px rgba(16,24,40,.16);
  --lula:#d7182a;--flavio:#1d5bd6;--ok:#16a34a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f13;--card:#161a21;--card2:#1c212a;--tx:#f3f4f6;--mut:#8b93a1;--ln:#272d38;--na:#2a303b;--txi:#fff;--sh:none;--tsh:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d0f13;--card:#161a21;--card2:#1c212a;--tx:#f3f4f6;--mut:#8b93a1;--ln:#272d38;--na:#2a303b;--txi:#fff;--sh:none;--tsh:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 32px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;position:relative}
/* linha fina que enche até a próxima atualização */
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--ok);opacity:.55;transform:scaleX(0);transform-origin:left}
header.ciclo:after{animation:ciclo 30s linear forwards}
@keyframes ciclo{to{transform:scaleX(1)}}
@media(min-width:601px){header{position:sticky;top:0;z-index:20;margin:-20px -16px 16px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}}
.ti{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
/* dica flutuante dos mapas */
#tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .15s;will-change:transform}
#tip.on{opacity:1}
#tip .tc{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;box-shadow:var(--tsh);font-size:12px;min-width:190px}
#tip.on .tc{animation:pop .18s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{transform:scale(.94) translateY(4px)}}
#tip .tn{font-weight:700;font-size:13px;margin-bottom:6px}
#tip .tr{display:flex;align-items:center;gap:6px;margin-top:4px}#tip .tr b{margin-left:auto;font-variant-numeric:tabular-nums}
#tip .tv{font-size:11px;margin-left:15px}#tip .tf{margin-top:6px;padding-top:6px;border-top:1px solid var(--ln);font-size:11px}
/* esqueleto enquanto os dados não chegam */
.sk{border-radius:10px;background:linear-gradient(90deg,var(--card2) 25%,var(--ln) 50%,var(--card2) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
/* brilho suave do lado de quem lidera */
#hero{position:relative;overflow:hidden}#hero>*{position:relative}
#hero:before{content:"";position:absolute;top:-60%;width:60%;height:220%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--lc,transparent) 14%,transparent),transparent);transition:opacity .6s}
#hero[data-lado=l]:before{left:-15%}#hero[data-lado=r]:before{right:-15%}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--ln);padding:6px 12px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:p 2s infinite}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 12px Inter,system-ui,sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--ln);padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .15s}
.btn[hidden]{display:none}.btn:hover{background:var(--card2)}.btn:disabled{opacity:.6;cursor:default}
.btn{transition:background .15s,transform .12s}.btn:active:not(:disabled){transform:scale(.96)}
.btn .ic{display:inline-block}.btn.gir .ic{animation:gira .8s linear infinite}#bbr{animation:sobe .3s ease-out backwards}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}}
@keyframes realce{from{background:color-mix(in srgb,var(--ok) 22%,transparent)}}
header,.card{animation:sobe .5s cubic-bezier(.2,.7,.2,1) backwards}.grid>.card{animation-delay:.08s}.grid>.card+.card{animation-delay:.16s}
.ent{animation:sobe .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*20ms)}
tr.mud{animation:realce .6s ease-out}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

/* HERO */
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hero-top h2{margin:2px 0 0;font-size:18px;font-weight:700}
.hero-top a{color:var(--mut);font-size:12px;text-decoration:none;margin-left:10px}
.apur{text-align:right}
.apur b{font-size:22px;font-weight:800;display:block;line-height:1.1}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px}
.cand{display:flex;flex-direction:column;gap:2px;min-width:0}
.cand.r{text-align:right;align-items:flex-end}
.cand .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .sw{width:10px;height:10px;border-radius:3px;flex:none}
.flag{width:24px;height:17px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.cand .pc{font-size:40px;font-weight:800;line-height:1.05;color:var(--txi);letter-spacing:-.02em}
.cand .vt{font-size:14px;color:var(--txi);font-weight:500}
.dif{text-align:center;background:var(--card2);border:1px solid var(--ln);border-radius:14px;padding:12px 18px;min-width:210px}
.dif b{display:block;font-size:30px;font-weight:800;line-height:1.1;color:var(--txi);letter-spacing:-.01em}
.dif small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.dif .who{font-size:12px;font-weight:600;margin-top:4px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:18px 0 10px;background:var(--na);position:relative}
.bar div{height:100%;transition:width .8s ease}
.bar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.5}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.prog .t{flex:1;height:4px;background:var(--ln);border-radius:4px;overflow:hidden}.prog .t i{display:block;height:100%;background:var(--tx);opacity:.75;transition:width .8s}
.el{font-size:10px;font-weight:700;background:var(--ok);color:#fff;padding:2px 6px;border-radius:4px;letter-spacing:.04em}

/* GRID */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;margin-top:16px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.h2h{grid-template-columns:1fr 1fr}.dif{grid-column:1/-1;order:3}.cand .pc{font-size:32px}}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600}
#map{max-width:540px;margin:auto}#map svg{width:100%;height:auto;display:block}
#map path{stroke:var(--card);stroke-width:1.2;cursor:pointer;transition:fill .4s,fill-opacity .4s}
#map path.na{fill:var(--na);cursor:default}#map path.sel{stroke:var(--tx);stroke-width:2.5}
#map path:hover{filter:brightness(1.15)}
#mapuf{max-width:540px;margin:auto}#mapuf svg{width:100%;height:auto;max-height:600px;display:block}
#mapuf path{fill:var(--na);stroke:var(--card);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .4s,fill-opacity .4s}
#mapuf path:hover{filter:brightness(1.15);stroke:var(--tx);stroke-width:1.2}
.carr{font-size:12px;color:var(--mut);text-align:center;padding:6px 0}.carr:empty{display:none}
#map text{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.lg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:12px;font-size:12px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

/* TABLE */
.tw{overflow-x:auto;margin:0 -8px;padding:0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--card);z-index:1;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}
td{padding:7px 6px;border-bottom:1px solid var(--ln)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:var(--card2)}
tbody tr.sel{background:var(--card2);box-shadow:inset 3px 0 0 var(--tx)}
td.ld{white-space:nowrap;font-size:12px}
.mb{display:flex;height:20px;border-radius:6px;overflow:hidden;min-width:130px}
@media(max-width:600px){
  .wrap{padding:14px 12px 24px}.card{padding:14px;border-radius:14px}
  .cand .pc{font-size:28px}.cand .nm{font-size:13px}.dif b{font-size:24px}.dif{padding:10px 12px;min-width:0}
  table{font-size:12px}th{padding:6px 4px;font-size:10px}td{padding:6px 4px}
  .ld{display:none}.mb{min-width:96px}.mb i{font-size:10px}
  #top5 td:first-child span{display:block}.vv{font-size:10px}
  h1{font-size:17px}.tse,.tl{display:none}
}
.mb i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;transition:width .6s}
.top5{margin-top:20px;padding-top:16px;border-top:1px solid var(--ln)}
.vv{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut);margin-top:2px}
.foot{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}
.resumo{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 20px;margin-bottom:8px;color:var(--tx)}
.resumo b{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Apuração 2º Turno · 2026</h1>
    <div class="acts">
      <button class="btn" id="bbr" hidden>← Voltar para mapa Brasil</button>
      <button class="btn" id="batu"><span class="ic">↻</span> Atualizar dados</button>
      <button class="btn" id="btema"></button>
      <span class="live"><i></i><span id="upd">carregando…</span></span>
    </div>
  </header>

  <section class="card" id="hero"><div class="sk" style="height:96px"></div><div class="sk" style="height:14px;margin-top:22px"></div></section>

  <div class="grid">
    <section class="card"><h3 id="maph"></h3><div id="map"></div><div id="mapuf" hidden></div><div class="carr" id="carr"></div><div class="lg" id="lg"></div><div id="top5" class="top5"></div></section>
    <section class="card"><h3>Estados por tamanho do eleitorado</h3><div class="tw"><div class="sk" id="sktbl" style="height:420px"></div><table id="tbl"></table></div></section>
  </div>
  <div class="foot"><div id="resumo" class="resumo"></div>Fonte: TSE · resultados.tse.jus.br · atualiza a cada 30s · Mapas: @svg-maps/brazil (CC BY 4.0) e IBGE</div>
</div>
<div id="tip" role="tooltip"><div class="tc"></div></div>

<script>
(()=>{
const B='https://resultados.tse.jus.br/oficial/ele2026/';
const UFS=['ac','al','ap','am','ba','ce','df','es','go','ma','mt','ms','mg','pa','pb','pr','pe','pi','rj','rn','rs','ro','rr','sc','sp','se','to'];
const NS='http://www.w3.org/2000/svg';
let sel='br',data={},MAP=null;

const url=uf=>`${B}6258/dados/${uf}/${uf}-c0001-e006258-u.json`;
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const pct=(n,d=2)=>n.toFixed(d).replace('.',',');
function cands(o,a=[]){if(Array.isArray(o))o.forEach(x=>cands(x,a));else if(o&&typeof o==='object'){if(o.sqcand&&o.vap!==undefined)a.push(o);Object.values(o).forEach(v=>cands(v,a))}return a}
function cor(nome){const n=String(nome).toUpperCase();if(n.includes('LULA'))return 'var(--lula)';if(n.includes('FLAVIO')||n.includes('BOLSONARO'))return 'var(--flavio)';return '#888'}
const isLula=n=>/LULA/i.test(n);
// tom do mapa: mistura a cor do candidato com o cinza neutro (k=1 cor pura), funciona nos dois temas
const tom=(nm,k)=>`color-mix(in srgb,${cor(nm)} ${Math.round(Math.min(1,k)*100)}%,var(--na))`;
const NUF={ac:'Acre',al:'Alagoas',ap:'Amapá',am:'Amazonas',ba:'Bahia',ce:'Ceará',df:'Distrito Federal',es:'Espírito Santo',go:'Goiás',ma:'Maranhão',mt:'Mato Grosso',ms:'Mato Grosso do Sul',mg:'Minas Gerais',pa:'Pará',pb:'Paraíba',pr:'Paraná',pe:'Pernambuco',pi:'Piauí',rj:'Rio de Janeiro',rn:'Rio Grande do Norte',rs:'Rio Grande do Sul',ro:'Rondônia',rr:'Roraima',sc:'Santa Catarina',sp:'São Paulo',se:'Sergipe',to:'Tocantins'};
const ordLula=cs=>[...cs].sort((a,b)=>(isLula(b.nm)?1:0)-(isLula(a.nm)?1:0));
const mbar=x=>`<div class="mb">${ordLula(x.cs).map(c=>`<i style="width:${c.p}%;background:${cor(c.nm)}">${pct(c.p,1)}</i>`).join('')}</div>`;
const eleit=te=>te>=1e6?pct(te/1e6,1)+' mi':Math.round(te/1e3)+' mil';
const murl=(uf,cd)=>`${B}6258/dados/${uf}/${uf}${cd}-c0001-e006258-u.json`;
// maiores colégios eleitorais (eleitorado TSE 2026): [uf, código TSE, nome]
const TOP=[['sp','71072','São Paulo'],['rj','60011','Rio de Janeiro'],['df','97012','Brasília'],['mg','41238','Belo Horizonte'],['ba','38490','Salvador'],['ce','13897','Fortaleza'],['am','02550','Manaus']];
const cid={};
// animações: valores anteriores dos números, assinaturas das linhas e entrada só no 1º render
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const ANT={},ANTL={};let E='',prim=true,ultSel=null,rafC=0;
const nk=(k,v,p)=>`<span data-k="${k}" data-v="${v}"${p?' data-f="p"':''}>${p?pct(v):fmt(v)}</span>`;
const anim=el=>{if(!RM()&&el.animate)el.animate([{opacity:0,transform:'scale(.97)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.2,.7,.2,1)'})};
function conta(){const t0=performance.now();cancelAnimationFrame(rafC);
  const it=[...document.querySelectorAll('#hero [data-k],#resumo [data-k]')].map(e=>{const k=e.dataset.k,v=+e.dataset.v,a=ANT[k]??0;ANT[k]=v;
    return {e,a,v,f:e.dataset.f?pct:fmt}}).filter(o=>o.a!==o.v);
  if(!it.length||RM())return;
  const passo=t=>{const q=Math.min(1,(t-t0)/600),k=1-(1-q)**3;for(const o of it)o.e.textContent=o.f(o.a+(o.v-o.a)*k);if(q<1)rafC=requestAnimationFrame(passo)};
  passo(t0)}
const mud=(k,s)=>{const o=ANTL[k];ANTL[k]=s;return !prim&&o!==undefined&&o!==s?' mud':''};
// bandeira em SVG (emoji de bandeira não aparece no Windows)
const FLAG='<svg class="flag" viewBox="0 0 20 14" role="img" aria-label="Bandeira do Brasil"><rect width="20" height="14" rx="1.5" fill="#009c3b"/><path d="M10 1.6 18.4 7 10 12.4 1.6 7z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.1" fill="#002776"/><path d="M7 6.4c2-.7 4.3-.4 6 .9" stroke="#fff" stroke-width=".6" fill="none"/></svg>';

async function get(u){
  try{const r=await fetch(u+'?_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)return null;const d=await r.json();
    const cs=cands(d).map(x=>({nm:x.nmu||x.nm,p:num(x.pvap),v:num(x.vap),e:x.e==='s'})).sort((a,b)=>b.v-a.v);
    return {pst:num(d.s?.pst),ht:d.ht,te:num(d.e?.te),cs};}catch(e){return null}
}
let carregando=false,ultSig='';
async function load(){
  if(carregando)return;carregando=true;
  const b=document.getElementById('batu');b.disabled=true;b.classList.add('gir');b.innerHTML='<span class="ic">↻</span> Atualizando…';
  try{
    await Promise.all([...['br',...UFS].map(async u=>{const r=await get(url(u));if(r)data[u]=r}),
      ...TOP.map(async([u,cd])=>{const r=await get(murl(u,cd));if(r)cid[cd]=r})]);
    if(sel!=='br')atualizaUF(sel); // municípios do estado aberto, em segundo plano
    document.getElementById('upd').innerHTML='Atualizado '+new Date().toLocaleTimeString('pt-BR')+(data.br?`<span class="tse"> · TSE ${data.br.ht}</span>`:'');
    const hd=document.querySelector('header');hd.classList.remove('ciclo');void hd.offsetWidth;hd.classList.add('ciclo');
    // só redesenha se o TSE trouxe algo novo
    const sig=[...Object.entries(data),...Object.entries(cid)].map(([u,x])=>u+x.ht+x.pst).join();
    if(sig!==ultSig){ultSig=sig;render()}
  }finally{carregando=false;b.disabled=false;b.classList.remove('gir');b.innerHTML='<span class="ic">↻</span> Atualizar dados'}
}

function hero(r){
  if(!r)return `<div class="mut">Sem dados.</div>`;
  // ordem fixa: Flávio à esquerda, Lula à direita (igual à barra)
  const ord=[...r.cs].sort((a,b)=>(isLula(a.nm)?1:0)-(isLula(b.nm)?1:0));
  const [A,Bc]=ord;const lider=r.cs[0],seg=r.cs[1];
  const dif=seg?lider.v-seg.v:0,pp=seg?lider.p-seg.p:0;
  const cand=(c,right)=>`<div class="cand ${right?'r':''}">
      <div class="nm">${right?'':`<span class="sw" style="background:${cor(c.nm)}"></span>`}${right&&c===lider?FLAG:''}${c.nm}${c.e?' <span class="el">ELEITO</span>':''}${!right&&c===lider?FLAG:''}${right?`<span class="sw" style="background:${cor(c.nm)}"></span>`:''}</div>
      <div class="pc num">${nk('p'+c.nm,c.p,1)}%</div>
      <div class="vt num">${nk('v'+c.nm,c.v)} votos</div></div>`;
  return `<div class="h2h${E}">
      ${A?cand(A,false):''}
      ${seg?`<div class="dif"><div class="label">Diferença</div><b class="num">${nk('dif',dif)}</b><small>votos · ${nk('pp',pp,1)} p.p.</small><div class="who" style="color:${cor(lider.nm)}">vantagem de ${lider.nm}</div></div>`:'<div></div>'}
      ${Bc?cand(Bc,true):''}
    </div>
    <div class="bar${E}" style="--i:3">${ord.map(x=>`<div style="width:${x.p}%;background:${cor(x.nm)}"></div>`).join('')}</div>
    <div class="prog${E}" style="--i:5"><span>Seções totalizadas</span><span class="t"><i style="width:${r.pst}%"></i></span><span class="num">${nk('pst',r.pst,1)}%</span></div>`;
}

function render(){
  E=prim&&data.br?' ent':'';
  const he=document.getElementById('hero'),hr=data[sel];he.innerHTML=hero(hr);
  if(hr?.cs.length){he.style.setProperty('--lc',cor(hr.cs[0].nm));he.dataset.lado=isLula(hr.cs[0].nm)?'r':'l'}
  document.getElementById('sktbl')?.remove();tipK=null;
  document.getElementById('bbr').hidden=sel==='br';
  const ufm=document.getElementById('mapuf'),carr=document.getElementById('carr');
  const mp=document.getElementById('map');mp.hidden=sel!=='br';ufm.hidden=sel==='br';
  if(ultSel!==null&&ultSel!==sel)anim(sel==='br'?mp:ufm);ultSel=sel;
  document.getElementById('maph').innerHTML=sel==='br'?'Liderança por estado <span class="mut">· clique para detalhar</span>':`Liderança por município · ${sel.toUpperCase()} <span class="mut">· passe o mouse para ver</span>`;
  if(sel==='br')carr.textContent='';
  else if(UFM[sel]?.svg){if(ufm.firstChild!==UFM[sel].svg){ufm.replaceChildren(UFM[sel].svg);anim(ufm)}pintaUF(sel);if(!ufOcup.has(sel))carr.textContent=''}
  else{ufm.replaceChildren();carr.textContent=`Carregando mapa de ${sel.toUpperCase()}…`}
  const rs=data[sel];
  document.getElementById('resumo').innerHTML=rs?`<span>Presidente · <b>${sel==='br'?'Brasil':sel.toUpperCase()}</b></span><span>Total apurado <b class="num">${nk('rpst',rs.pst,1)}%</b></span><span><b class="num">${nk('rvv',rs.cs.reduce((s,x)=>s+x.v,0))}</b> votos válidos</span>`:'';
  conta();
  // mapa
  if(MAP){for(const uf of UFS){const p=MAP.paths[uf],t=MAP.labels[uf];if(!p)continue;const x=data[uf];
    t.textContent=uf.toUpperCase();
    if(x&&x.cs.length){const l=x.cs[0];const marg=x.cs[1]?l.p-x.cs[1].p:100;
      p.setAttribute('class',sel===uf?'sel':'');p.style.fill=tom(l.nm,x.pst?.4+marg/25:.3);
      p.onclick=()=>selecionar(uf);}
    else{p.setAttribute('class','na');p.style.fill='';p.onclick=null}}}
  const nomes=[...new Set((data.br?.cs||[]).map(c=>c.nm))];
  document.getElementById('lg').innerHTML=nomes.map(n=>`<span><span class="dot" style="background:${cor(n)}"></span>${n}</span>`).join('')+'<span class="mut">cor mais forte = vantagem maior</span>';
  // tabela
  const rows=Object.entries(data).filter(([u])=>u!=='br').sort((a,b)=>b[1].te-a[1].te);
  document.getElementById('tbl').innerHTML=`<thead><tr><th>UF</th><th class="n">Eleitores</th><th class="ld">Líder</th><th>Lula × Flávio (%)</th><th class="n">Apurado</th></tr></thead><tbody>`+
   rows.map(([u,x],i)=>{const l=x.cs[0]||{};
     const mb=mbar(x),el=eleit(x.te);
     return `<tr data-u="${u}" class="${sel===u?'sel':''}${E}${mud(u,x.pst+'|'+x.cs.map(c=>c.v))}" style="--i:${i+6}"><td><b>${u.toUpperCase()}</b></td><td class="n mut">${el}</td><td class="ld"><span class="dot" style="background:${cor(l.nm)}"></span> ${l.nm||'-'}${l.e?' <span class="el">ELEITO</span>':''}</td><td>${mb}</td><td class="n">${pct(x.pst,1)}%</td></tr>`}).join('')+'</tbody>';
  // maiores colégios eleitorais (só na visão Brasil)
  const t5=document.getElementById('top5');t5.hidden=sel!=='br';
  if(sel==='br')t5.innerHTML=`<h3>Maiores colégios eleitorais</h3><div class="tw"><table><thead><tr><th>Cidade</th><th class="n">Eleitores</th><th>Lula × Flávio</th><th class="n">Apurado</th></tr></thead><tbody>`+
    TOP.map(([u,cd,nm],i)=>{const x=cid[cd];if(!x)return `<tr data-u="${u}" class="${E}" style="--i:${i+8}"><td><b>${nm}</b> <span class="mut">${u.toUpperCase()}</span></td><td class="n mut">-</td><td class="mut">sem dados</td><td class="n">-</td></tr>`;
      const ord=ordLula(x.cs);
      return `<tr data-u="${u}" class="${E}${mud('c'+cd,x.pst+'|'+x.cs.map(c=>c.v))}" style="--i:${i+8}"><td><b>${nm}</b> <span class="mut">${u.toUpperCase()}</span></td><td class="n mut">${eleit(x.te)}</td><td>${mbar(x)}<div class="vv num">${ord.map(c=>`<span>${fmt(c.v)}</span>`).join('')}</div></td><td class="n">${pct(x.pst,1)}%</td></tr>`}).join('')+'</tbody></table></div>';
  document.querySelectorAll('#tbl tr[data-u],#top5 tr[data-u]').forEach(t=>t.onclick=()=>{selecionar(t.dataset.u);scrollTo({top:0,behavior:'smooth'})});
  if(E)prim=false;
}

function selecionar(uf){sel=uf;render();if(uf!=='br')atualizaUF(uf)}

// ---- mapa municipal: nada aqui roda na visão Brasil; só carrega ao abrir um estado ----
const UFM={},ufOcup=new Set();let CM=null;
const jget=async(u,bust)=>{const r=await fetch(u+(bust?'?_='+Date.now():''),{cache:bust?'no-store':'default',signal:AbortSignal.timeout(20000)});if(!r.ok)throw r.status;return r.json()};
async function pool(itens,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,itens.length)},async()=>{while(i<itens.length)await fn(itens[i++])}))}

const IBGE={ac:12,al:27,ap:16,am:13,ba:29,ce:23,df:53,es:32,go:52,ma:21,mt:51,ms:50,mg:31,pa:15,pb:25,pr:41,pe:26,pi:22,rj:33,rn:24,rs:43,ro:11,rr:14,sc:42,sp:35,se:28,to:17};
async function montaGeo(uf,M){
  // códigos TSE ↔ IBGE e contornos baixam em paralelo
  const [cm,geo]=await Promise.all([CM||(CM=jget(B+'6258/config/mun-e006258-cm.json').catch(e=>{CM=null;throw e})),
    jget(`https://servicodados.ibge.gov.br/api/v3/malhas/estados/${IBGE[uf]}?intrarregiao=municipio&formato=application/vnd.geo%2Bjson&qualidade=minima`)]);
  const est=cm.abr.find(a=>a.cd===uf),porIbge={},nomes={};
  est.mu.forEach(m=>{porIbge[m.cdi]=m.cd;nomes[m.cd]=m.nm});
  const polys=f=>f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  geo.features.forEach(f=>polys(f).forEach(pl=>pl.forEach(r=>r.forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}))));
  // projeção equirretangular com correção pela latitude média
  const k=Math.cos((y0+y1)/2*Math.PI/180),S=1000/Math.max((x1-x0)*k,y1-y0);
  const P=([x,y])=>((x-x0)*k*S).toFixed(1)+' '+((y1-y)*S).toFixed(1);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${Math.ceil((x1-x0)*k*S)} ${Math.ceil((y1-y0)*S)}`);
  const paths={};
  geo.features.forEach(f=>{const cd=porIbge[f.properties.codarea];if(!cd)return;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',polys(f).map(pl=>pl.map(r=>'M'+r.map(P).join('L')+'Z').join('')).join(''));
    p.dataset.cd=cd;svg.appendChild(p);paths[cd]=p});
  Object.assign(M,{svg,paths,nomes});
}

function pintaUF(uf){const M=UFM[uf];if(!M?.paths)return;
  for(const [cd,p] of Object.entries(M.paths)){const x=M.res[cd];
    if(x&&x.cs.length&&x.cs[0].v){const l=x.cs[0],marg=x.cs[1]?l.p-x.cs[1].p:100;p.style.fill=tom(l.nm,.35+marg/40)}
    else p.style.fill=''}}

async function atualizaUF(uf){
  if(ufOcup.has(uf))return;ufOcup.add(uf);
  const carr=document.getElementById('carr'),aviso=s=>{if(sel===uf)carr.textContent=s};
  const M=UFM[uf]||(UFM[uf]={res:{},ht:{}});
  // pinta no máximo a cada 200ms enquanto os votos chegam
  let agendado=false;const agenda=()=>{if(agendado)return;agendado=true;setTimeout(()=>{agendado=false;if(sel===uf)pintaUF(uf)},200)};
  try{
    // contornos e votos baixam ao mesmo tempo; o mapa aparece cinza e vai sendo pintado
    const geoP=M.svg?null:montaGeo(uf,M).then(()=>{if(sel===uf)render()});
    // o arquivo de abrangência traz a hora de totalização de cada município: só baixa os que mudaram
    let lista;
    try{const ab=await jget(`${B}6258/dados/${uf}/${uf}-e006258-ab.json`,true);
      lista=ab.abr.filter(a=>a.tpabr==='mun'&&a.ht&&M.ht[a.cdabr]!==a.ht).map(a=>[a.cdabr,a.ht]);}
    catch(e){await geoP;lista=Object.keys(M.paths).filter(cd=>!M.res[cd]).map(cd=>[cd,null])}
    const novo=!Object.keys(M.res).length;let feitos=0;
    await pool(lista,32,async([cd,ht])=>{if(sel!==uf)return;
      const r=await get(murl(uf,cd));
      if(r){M.res[cd]=r;M.ht[cd]=ht}feitos++;
      if(novo&&sel===uf){agenda();aviso(`Carregando municípios ${feitos}/${lista.length}…`)}});
    await geoP;
    if(sel===uf){pintaUF(uf);aviso('')}
  }catch(e){aviso('Não foi possível carregar os municípios.')}
  finally{ufOcup.delete(uf)}
}

async function loadMap(){ // contornos dos estados extraídos de @svg-maps/brazil (CC BY 4.0), hospedados junto com o site
  try{const m=await (await fetch('brasil.json')).json();
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',m.viewBox);
    document.getElementById('map').appendChild(svg);anim(svg);
    const paths={},labels={};
    for(const id of UFS){const p=document.createElementNS(NS,'path');p.setAttribute('d',m.paths[id]);p.dataset.uf=id;svg.appendChild(p);paths[id]=p}
    const OFF={rn:[4,-2],pb:[6,0],pe:[10,0],al:[5,2],se:[3,3],es:[3,0],rj:[2,2],sc:[2,0]};
    for(const [id,p] of Object.entries(paths)){const b=p.getBBox();const o=OFF[id]||[0,0];
      const tx=document.createElementNS(NS,'text');tx.setAttribute('x',b.x+b.width/2+o[0]);tx.setAttribute('y',b.y+b.height/2+o[1]);
      if(['df','se','al','pb','rn','pe','es','rj','sc'].includes(id))tx.style.fontSize='8px';
      svg.appendChild(tx);labels[id]=tx;}
    MAP={paths,labels};
  }catch(e){document.getElementById('map').innerHTML='<div class="mut">Não foi possível carregar o mapa.</div>'}
}
// ---- dica flutuante: mouse passa por cima; no toque, o mapa municipal mostra ao tocar ----
const tip=document.getElementById('tip'),tipc=tip.firstChild;let tipK=null,tipRaf=0;
function tipDados(p){
  if(p.dataset.uf){const u=p.dataset.uf;return [u,`${NUF[u]} · ${u.toUpperCase()}`,data[u]]}
  if(p.dataset.cd&&UFM[sel]){const M=UFM[sel],cd=p.dataset.cd;return [sel+cd,`${M.nomes[cd]} · ${sel.toUpperCase()}`,M.res[cd]]}
}
function mostraTip(e){const p=e.target.closest?.('path'),d=p&&tipDados(p);if(!d){escondeTip();return}
  const [k,nm,x]=d;
  if(k!==tipK){tipK=k;
    tipc.innerHTML=`<div class="tn">${nm}</div>`+(x&&x.cs.length&&x.cs[0].v?ordLula(x.cs).map(c=>`<div class="tr"><span class="dot" style="background:${cor(c.nm)}"></span>${c.nm}<b>${pct(c.p)}%</b></div><div class="tv mut num">${fmt(c.v)} votos</div>`).join('')+`<div class="tf mut">${pct(x.pst,1)}% das seções apuradas</div>`:'<div class="mut">sem dados ainda</div>');
    tip.classList.remove('on');void tip.offsetWidth;tip.classList.add('on')}
  const cx=e.clientX,cy=e.clientY;cancelAnimationFrame(tipRaf);
  tipRaf=requestAnimationFrame(()=>{const w=tip.offsetWidth,h=tip.offsetHeight;let x=cx+14,y=cy+14;
    if(x+w>innerWidth-8)x=cx-w-14;if(y+h>innerHeight-8)y=cy-h-14;
    tip.style.transform=`translate3d(${Math.max(8,x)}px,${Math.max(8,y)}px,0)`})}
function escondeTip(){tipK=null;tip.classList.remove('on')}
for(const id of ['map','mapuf']){const el=document.getElementById(id);
  el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')mostraTip(e)});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')escondeTip()})}
document.getElementById('mapuf').addEventListener('click',mostraTip);
addEventListener('scroll',escondeTip,{passive:true});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'&&!e.target.closest?.('#mapuf'))escondeTip()});

// ---- tema: automático (segue o sistema) → claro → escuro ----
const bt=document.getElementById('btema'),TEMAS=['auto','light','dark'],TNOME={auto:'Automático',light:'Claro',dark:'Escuro'};
const TICO={auto:'<svg class="ti" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  light:'<svg class="ti" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg class="ti" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function aplicaTema(t){const r=document.documentElement;if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  try{t==='auto'?localStorage.removeItem('tema'):localStorage.setItem('tema',t)}catch(e){}
  bt.innerHTML=TICO[t]+`<span class="tl">${TNOME[t]}</span>`;bt.title='Tema: '+TNOME[t];bt.setAttribute('aria-label','Tema: '+TNOME[t]+' (clique para trocar)')}
aplicaTema(document.documentElement.dataset.theme||'auto');
bt.onclick=e=>{const nx=TEMAS[(TEMAS.indexOf(document.documentElement.dataset.theme||'auto')+1)%3];
  if(!document.startViewTransition||RM()){aplicaTema(nx);return}
  // revela o novo tema num círculo que cresce a partir do botão
  const x=e.clientX||innerWidth-40,y=e.clientY||40,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>aplicaTema(nx)).ready.then(()=>document.documentElement.animate(
    {clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:550,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})};

document.getElementById('batu').onclick=load;
document.getElementById('bbr').onclick=()=>selecionar('br');
// mapa e dados carregam em paralelo; ao chegar o mapa, redesenha com o que já houver
loadMap().then(()=>{if(Object.keys(data).length)render()});load();
setInterval(()=>{if(!document.hidden)load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
